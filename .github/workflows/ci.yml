# PR validation; the same checks as the pre-commit hook, run on the whole repo.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint infra
        working-directory: infra
        run: npm run lint
      - name: Typecheck infra
        working-directory: infra
        run: npm run build
      - name: Unit tests
        working-directory: infra
        run: npm test
      - name: Lint web
        working-directory: web
        run: npm run lint
      # No VITE_* values needed: they are only read at runtime.
      - name: Build web
        working-directory: web
        run: npm run build
