enum Criticality {
  HIGH
  MEDIUM
  LOW
}

enum Status {
  OPEN
  DONE
}

enum Frequency {
  DAILY
  WEEKLY
  MONTHLY
}

enum Role {
  ADMIN
  USER
  GUEST
}

type User {
  userId: ID!
  email: String!
  displayName: String!
  "ADMIN manages people; USER has a workspace of their own; GUEST only sees lists shared with them."
  role: Role!
  isAdmin: Boolean!
  enabled: Boolean!
}

"Returned once by createUser / resetUserPassword; never stored."
type UserWithPassword {
  user: User!
  temporaryPassword: String!
}

type Folder {
  folderId: ID!
  name: String!
}

type ListSummary {
  listId: ID!
  name: String!
  ownerId: ID!
  ownerName: String!
  isOwner: Boolean!
  isInbox: Boolean!
  "The caller's own folder for this list; null = root."
  folderId: ID
  memberCount: Int!
  "The part before the @ of the list's email address; null = email is off."
  mailName: String
  "Open (not completed) items in the list; subitems are not counted."
  openCount: Int!
}

type Member {
  userId: ID!
  email: String!
  displayName: String!
  isOwner: Boolean!
}

type Subitem {
  subitemId: ID!
  title: String!
  status: Status!
}

type Item {
  itemId: ID!
  listId: ID!
  listName: String
  title: String!
  "Longer free text."
  notes: String
  status: Status!
  "YYYY-MM-DD"
  dueDate: String
  criticality: Criticality
  recurringId: ID
  subitems: [Subitem!]!
  createdAt: String!
  completedAt: String
}

type LinkPreview {
  url: String!
  title: String
  description: String
  siteName: String
}

enum SenderStatus {
  PENDING
  EXPIRED
  VERIFIED
}

"An extra address the caller may send mail from, acting as themselves."
type SenderAddress {
  email: String!
  status: SenderStatus!
  "While PENDING: send a mail from the address to me@ with this code in the subject."
  code: String
  "When a pending code stops working."
  expiresAt: String
}

type Recurring {
  recurringId: ID!
  title: String!
  targetListId: ID!
  targetListName: String
  frequency: Frequency!
  "Every N days/weeks/months."
  interval: Int!
  "0 = Sunday … 6 = Saturday. WEEKLY only."
  weekday: Int
  "1–31, clamped to the month's length. MONTHLY only."
  dayOfMonth: Int
  "YYYY-MM-DD: first occurrence on or after this date."
  startDate: String!
  "YYYY-MM-DD: the next occurrence the scheduler will act on."
  nextDue: String!
  criticality: Criticality
  active: Boolean!
}

input RecurringInput {
  title: String!
  targetListId: ID!
  frequency: Frequency!
  interval: Int!
  weekday: Int
  dayOfMonth: Int
  startDate: String!
  criticality: Criticality
  active: Boolean
}

input ItemPatch {
  title: String
  "Explicit null (or blank) clears the notes."
  notes: String
  "Explicit null clears the due date."
  dueDate: String
  "Explicit null clears the criticality."
  criticality: Criticality
}

type Query {
  me: User!
  listUsers: [User!]!
  listFolders: [Folder!]!
  listLists: [ListSummary!]!
  listMembers(listId: ID!): [Member!]!
  listItems(listId: ID!): [Item!]!
  "Open items with a due date, across every list the caller can see."
  listAgenda: [Item!]!
  "Open items with a criticality, across every list the caller can see."
  listPriority: [Item!]!
  listRecurring: [Recurring!]!
  "Title and description of a link, read from the page. Fields are null when the page can't be read."
  linkPreview(url: String!): LinkPreview!
  "The domain items can be emailed to (me@ and list addresses); null when email is not set up."
  mailDomain: String
  listSenderAddresses: [SenderAddress!]!
}

type Mutation {
  # --- admin: who is authorized to use the app at all
  createUser(email: String!, displayName: String!, role: Role!): UserWithPassword!
  resetUserPassword(userId: ID!): UserWithPassword!
  setUserEnabled(userId: ID!, enabled: Boolean!): User!
  "Admin only. One step at a time: GUEST ⇄ USER ⇄ ADMIN. The person is signed out so the new role applies."
  setUserRole(userId: ID!, role: Role!): User!

  # --- folders (personal to the caller)
  createFolder(name: String!): Folder!
  renameFolder(folderId: ID!, name: String!): Folder!
  deleteFolder(folderId: ID!): Boolean!

  # --- lists
  createList(name: String!, folderId: ID): ListSummary!
  renameList(listId: ID!, name: String!): ListSummary!
  "Owner only. Deletes the list, its items and every membership."
  deleteList(listId: ID!): Boolean!
  "Owner only. Turns the list's email address on (or renames it) with a unique name, or off with null."
  setListMailName(listId: ID!, name: String): ListSummary!
  "Starts (or restarts) proving that the caller controls an extra sender address."
  addSenderAddress(email: String!): SenderAddress!
  removeSenderAddress(email: String!): Boolean!
  "Moves the list within the caller's own folder tree only."
  moveList(listId: ID!, folderId: ID): ListSummary!
  "Owner only. The invitee must already be an authorized user."
  shareList(listId: ID!, email: String!): [Member!]!
  "Owner removes anyone; any member may remove themselves."
  unshareList(listId: ID!, userId: ID!): Boolean!

  # --- items
  createItem(listId: ID!, title: String!, notes: String, dueDate: String, criticality: Criticality): Item!
  updateItem(listId: ID!, itemId: ID!, patch: ItemPatch!): Item!
  setItemStatus(listId: ID!, itemId: ID!, status: Status!): Item!
  "Moves the item and its subitems to another list the caller can access."
  moveItem(listId: ID!, itemId: ID!, targetListId: ID!): Item!
  deleteItem(listId: ID!, itemId: ID!): Boolean!
  addSubitem(listId: ID!, itemId: ID!, title: String!): Item!
  setSubitemStatus(listId: ID!, itemId: ID!, subitemId: ID!, status: Status!): Item!
  deleteSubitem(listId: ID!, itemId: ID!, subitemId: ID!): Item!

  # --- recurring items (personal to the caller)
  createRecurring(input: RecurringInput!): Recurring!
  updateRecurring(recurringId: ID!, input: RecurringInput!): Recurring!
  deleteRecurring(recurringId: ID!): Boolean!
}

schema {
  query: Query
  mutation: Mutation
}
